steps:
  - id: build-monitoring
    name: 'gcr.io/cloud-builders/docker'
    env:
      - 'DOCKER_BUILDKIT=1'
    args:
      - 'build'
      - '-t'
      - 'europe-west3-docker.pkg.dev/mlops-eurosat-496913/mlops-eurosat/monitoring:latest'
      - '-f'
      - 'dockerfiles/monitoring.dockerfile'
      - '.'
  - id: push-monitoring
    name: 'gcr.io/cloud-builders/docker'
    waitFor: ['build-monitoring']
    args:
      - 'push'
      - 'europe-west3-docker.pkg.dev/mlops-eurosat-496913/mlops-eurosat/monitoring:latest'
  - id: deploy-monitoring
    name: 'gcr.io/cloud-builders/gcloud'
    waitFor: ['push-monitoring']
    args:
      - 'run'
      - 'deploy'
      - 'eurosat-monitoring'
      - '--image=europe-west3-docker.pkg.dev/mlops-eurosat-496913/mlops-eurosat/monitoring:latest'
      - '--region=europe-west3'
      - '--no-allow-unauthenticated'
      - '--port=8080'
      - '--memory=4Gi'
      - '--cpu=2'
      - '--timeout=300'
      - '--set-env-vars=MONITORING_BUCKET=eurosat_monitoring'
images:
  - 'europe-west3-docker.pkg.dev/mlops-eurosat-496913/mlops-eurosat/monitoring:latest'
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
