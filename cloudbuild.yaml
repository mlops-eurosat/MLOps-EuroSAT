steps:
  # ---- Build phase: all images build in parallel (waitFor ['-']) ----
  - id: build-train
    name: 'gcr.io/cloud-builders/docker'
    waitFor: ['-']
    env:
      - 'DOCKER_BUILDKIT=1'
    args:
      - 'build'
      - '-t'
      - 'europe-west3-docker.pkg.dev/mlops-eurosat-496913/mlops-eurosat/train:latest'
      - '--cache-from'
      - 'europe-west3-docker.pkg.dev/mlops-eurosat-496913/mlops-eurosat/train:latest'
      - '--build-arg'
      - 'BUILDKIT_INLINE_CACHE=1'
      - '-f'
      - 'dockerfiles/train.dockerfile'
      - '.'
  - id: build-api
    name: 'gcr.io/cloud-builders/docker'
    waitFor: ['-']
    env:
      - 'DOCKER_BUILDKIT=1'
    args:
      - 'build'
      - '-t'
      - 'europe-west3-docker.pkg.dev/mlops-eurosat-496913/mlops-eurosat/api:latest'
      - '--cache-from'
      - 'europe-west3-docker.pkg.dev/mlops-eurosat-496913/mlops-eurosat/api:latest'
      - '--build-arg'
      - 'BUILDKIT_INLINE_CACHE=1'
      - '-f'
      - 'dockerfiles/api.dockerfile'
      - '.'
  - id: build-trigger
    name: 'gcr.io/cloud-builders/docker'
    waitFor: ['-']
    env:
      - 'DOCKER_BUILDKIT=1'
    args:
      - 'build'
      - '-t'
      - 'europe-west3-docker.pkg.dev/mlops-eurosat-496913/mlops-eurosat/trigger:latest'
      - '--cache-from'
      - 'europe-west3-docker.pkg.dev/mlops-eurosat-496913/mlops-eurosat/trigger:latest'
      - '--build-arg'
      - 'BUILDKIT_INLINE_CACHE=1'
      - '-f'
      - 'dockerfiles/trigger.dockerfile'
      - '.'
  - id: build-frontend
    name: 'gcr.io/cloud-builders/docker'
    waitFor: ['-']
    env:
      - 'DOCKER_BUILDKIT=1'
    args:
      - 'build'
      - '-t'
      - 'europe-west3-docker.pkg.dev/mlops-eurosat-496913/mlops-eurosat/frontend:latest'
      - '--cache-from'
      - 'europe-west3-docker.pkg.dev/mlops-eurosat-496913/mlops-eurosat/frontend:latest'
      - '--build-arg'
      - 'BUILDKIT_INLINE_CACHE=1'
      - '-f'
      - 'dockerfiles/frontend.dockerfile'
      - '.'
  - id: build-monitoring
    name: 'gcr.io/cloud-builders/docker'
    waitFor: ['-']
    env:
      - 'DOCKER_BUILDKIT=1'
    args:
      - 'build'
      - '-t'
      - 'europe-west3-docker.pkg.dev/mlops-eurosat-496913/mlops-eurosat/monitoring:latest'
      - '--cache-from'
      - 'europe-west3-docker.pkg.dev/mlops-eurosat-496913/mlops-eurosat/monitoring:latest'
      - '--build-arg'
      - 'BUILDKIT_INLINE_CACHE=1'
      - '-f'
      - 'dockerfiles/monitoring.dockerfile'
      - '.'

  # ---- Push phase: each push waits only on its own build, so pushes overlap ----
  - id: push-train
    name: 'gcr.io/cloud-builders/docker'
    waitFor: ['build-train']
    args:
      - 'push'
      - 'europe-west3-docker.pkg.dev/mlops-eurosat-496913/mlops-eurosat/train:latest'
  - id: push-api
    name: 'gcr.io/cloud-builders/docker'
    waitFor: ['build-api']
    args:
      - 'push'
      - 'europe-west3-docker.pkg.dev/mlops-eurosat-496913/mlops-eurosat/api:latest'
  - id: push-trigger
    name: 'gcr.io/cloud-builders/docker'
    waitFor: ['build-trigger']
    args:
      - 'push'
      - 'europe-west3-docker.pkg.dev/mlops-eurosat-496913/mlops-eurosat/trigger:latest'
  - id: push-frontend
    name: 'gcr.io/cloud-builders/docker'
    waitFor: ['build-frontend']
    args:
      - 'push'
      - 'europe-west3-docker.pkg.dev/mlops-eurosat-496913/mlops-eurosat/frontend:latest'
  - id: push-monitoring
    name: 'gcr.io/cloud-builders/docker'
    waitFor: ['build-monitoring']
    args:
      - 'push'
      - 'europe-west3-docker.pkg.dev/mlops-eurosat-496913/mlops-eurosat/monitoring:latest'

  # ---- Deploy phase: each deploy waits on its own push so it ships the fresh image ----
  - id: deploy-api
    name: 'gcr.io/cloud-builders/gcloud'
    waitFor: ['push-api']
    args:
      - 'run'
      - 'deploy'
      - 'eurosat-api'
      - '--image=europe-west3-docker.pkg.dev/mlops-eurosat-496913/mlops-eurosat/api:latest'
      - '--region=europe-west3'
      - '--allow-unauthenticated'
      - '--port=8080'
  - id: deploy-frontend
    name: 'gcr.io/cloud-builders/gcloud'
    waitFor: ['push-frontend']
    args:
      - 'run'
      - 'deploy'
      - 'eurosat-frontend'
      - '--image=europe-west3-docker.pkg.dev/mlops-eurosat-496913/mlops-eurosat/frontend:latest'
      - '--region=europe-west3'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--set-secrets=SH_CLIENT_ID=sh-client-id:latest,SH_CLIENT_SECRET=sh-client-secret:latest'
  - id: deploy-monitoring
    name: 'gcr.io/cloud-builders/gcloud'
    waitFor: ['push-monitoring']
    args:
      - 'run'
      - 'deploy'
      - 'eurosat-monitoring'
      - '--image=europe-west3-docker.pkg.dev/mlops-eurosat-496913/mlops-eurosat/monitoring:latest'
      - '--region=europe-west3'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--memory=4Gi'
      - '--cpu=2'
      - '--timeout=300'
      - '--set-env-vars=MONITORING_BUCKET=eurosat_monitoring,MIN_SAMPLES=100,MAX_STALENESS_HOURS=48'
  - id: deploy-trigger
    name: 'gcr.io/cloud-builders/gcloud'
    waitFor: ['push-trigger']
    # Deliberately no --allow-unauthenticated: the registry-change handler is invoked
    # by Eventarc through an authenticated invoker SA, so the service must stay private.
    # A bare deploy only updates the image and preserves the existing IAM, SA and env.
    args:
      - 'run'
      - 'deploy'
      - 'eurosat-registry-trigger'
      - '--image=europe-west3-docker.pkg.dev/mlops-eurosat-496913/mlops-eurosat/trigger:latest'
      - '--region=europe-west3'
      - '--port=8080'
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
