steps:
  - id: build-train
    name: 'gcr.io/cloud-builders/docker'
    waitFor: ['-']
    env:
      - 'DOCKER_BUILDKIT=1'
    args:
      - 'build'
      - '-t'
      - 'europe-west3-docker.pkg.dev/mlops-eurosat-496913/mlops-eurosat/train:latest'
      - '-f'
      - 'dockerfiles/train.dockerfile'
      - '.'
  - id: build-api
    name: 'gcr.io/cloud-builders/docker'
    waitFor: ['-']
    env:
      - 'DOCKER_BUILDKIT=1'
    args:
      - 'build'
      - '-t'
      - 'europe-west3-docker.pkg.dev/mlops-eurosat-496913/mlops-eurosat/api:latest'
      - '-f'
      - 'dockerfiles/api.dockerfile'
      - '.'
  - id: build-trigger
    name: 'gcr.io/cloud-builders/docker'
    waitFor: ['-']
    env:
      - 'DOCKER_BUILDKIT=1'
    args:
      - 'build'
      - '-t'
      - 'europe-west3-docker.pkg.dev/mlops-eurosat-496913/mlops-eurosat/trigger:latest'
      - '-f'
      - 'dockerfiles/trigger.dockerfile'
      - '.'
  - id: build-frontend
    name: 'gcr.io/cloud-builders/docker'
    waitFor: ['-']
    env:
      - 'DOCKER_BUILDKIT=1'
    args:
      - 'build'
      - '-t'
      - 'europe-west3-docker.pkg.dev/mlops-eurosat-496913/mlops-eurosat/frontend:latest'
      - '-f'
      - 'dockerfiles/frontend.dockerfile'
      - '.'
images:
  - 'europe-west3-docker.pkg.dev/mlops-eurosat-496913/mlops-eurosat/train:latest'
  - 'europe-west3-docker.pkg.dev/mlops-eurosat-496913/mlops-eurosat/api:latest'
  - 'europe-west3-docker.pkg.dev/mlops-eurosat-496913/mlops-eurosat/trigger:latest'
  - 'europe-west3-docker.pkg.dev/mlops-eurosat-496913/mlops-eurosat/frontend:latest'
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
