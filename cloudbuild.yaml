steps:
  - id: build-train
    name: 'gcr.io/cloud-builders/docker'
    waitFor: ['-']
    env:
      - 'DOCKER_BUILDKIT=1'
    args:
      - 'build'
      - '-t'
      - 'europe-west3-docker.pkg.dev/mlops-eurosat-496913/mlops-eurosat/train:latest'
      - '--cache-from'
      - 'europe-west3-docker.pkg.dev/mlops-eurosat-496913/mlops-eurosat/train:latest'
      - '--build-arg'
      - 'BUILDKIT_INLINE_CACHE=1'
      - '-f'
      - 'dockerfiles/train.dockerfile'
      - '.'
  - id: build-api
    name: 'gcr.io/cloud-builders/docker'
    waitFor: ['-']
    env:
      - 'DOCKER_BUILDKIT=1'
    args:
      - 'build'
      - '-t'
      - 'europe-west3-docker.pkg.dev/mlops-eurosat-496913/mlops-eurosat/api:latest'
      - '--cache-from'
      - 'europe-west3-docker.pkg.dev/mlops-eurosat-496913/mlops-eurosat/api:latest'
      - '--build-arg'
      - 'BUILDKIT_INLINE_CACHE=1'
      - '-f'
      - 'dockerfiles/api.dockerfile'
      - '.'
  - id: build-trigger
    name: 'gcr.io/cloud-builders/docker'
    waitFor: ['-']
    env:
      - 'DOCKER_BUILDKIT=1'
    args:
      - 'build'
      - '-t'
      - 'europe-west3-docker.pkg.dev/mlops-eurosat-496913/mlops-eurosat/trigger:latest'
      - '--cache-from'
      - 'europe-west3-docker.pkg.dev/mlops-eurosat-496913/mlops-eurosat/trigger:latest'
      - '--build-arg'
      - 'BUILDKIT_INLINE_CACHE=1'
      - '-f'
      - 'dockerfiles/trigger.dockerfile'
      - '.'
  - id: build-frontend
    name: 'gcr.io/cloud-builders/docker'
    waitFor: ['-']
    env:
      - 'DOCKER_BUILDKIT=1'
    args:
      - 'build'
      - '-t'
      - 'europe-west3-docker.pkg.dev/mlops-eurosat-496913/mlops-eurosat/frontend:latest'
      - '--cache-from'
      - 'europe-west3-docker.pkg.dev/mlops-eurosat-496913/mlops-eurosat/frontend:latest'
      - '--build-arg'
      - 'BUILDKIT_INLINE_CACHE=1'
      - '-f'
      - 'dockerfiles/frontend.dockerfile'
      - '.'
  - id: deploy-api
    name: 'gcr.io/cloud-builders/gcloud'
    waitFor: ['build-api']
    args:
      - 'run'
      - 'deploy'
      - 'eurosat-api'
      - '--image=europe-west3-docker.pkg.dev/mlops-eurosat-496913/mlops-eurosat/api:latest'
      - '--region=europe-west3'
      - '--allow-unauthenticated'
      - '--port=8080'
images:
  - 'europe-west3-docker.pkg.dev/mlops-eurosat-496913/mlops-eurosat/train:latest'
  - 'europe-west3-docker.pkg.dev/mlops-eurosat-496913/mlops-eurosat/api:latest'
  - 'europe-west3-docker.pkg.dev/mlops-eurosat-496913/mlops-eurosat/trigger:latest'
  - 'europe-west3-docker.pkg.dev/mlops-eurosat-496913/mlops-eurosat/frontend:latest'
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
