name: Data Statistics Check

on:
  push:
    branches:
      - main
    paths:
      - '**/*.dvc'
      - 'dvc.lock'
  pull_request:
    branches:
      - main
    paths:
      - '**/*.dvc'
      - 'dvc.lock'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  dataset_statistics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          pip install -e .
          pip install "dvc[gs]"
          pip list

      - name: Auth with GCP
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure DVC credentials
        run: |
          dvc remote modify --local storage credentialpath "$GOOGLE_APPLICATION_CREDENTIALS"

      - name: Pull data
        run: |
          dvc pull --no-run-cache

      - name: Check data statistics & generate report
        run: |
          echo '## Data statistics' > report.md
          echo '```' >> report.md
          python -m mlops_eurosat.dataset_statistics >> report.md
          echo '```' >> report.md
          echo '![](./reports/figures/eurosat_images.png "EuroSAT images")' >> report.md
          echo '![](./reports/figures/train_label_distribution.png "Train label distribution")' >> report.md
          echo '![](./reports/figures/val_label_distribution.png "Val label distribution")' >> report.md
          echo '![](./reports/figures/test_label_distribution.png "Test label distribution")' >> report.md

      - name: Install CML system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev libpixman-1-dev

      - name: Setup cml
        uses: iterative/setup-cml@v3

      - name: Comment on PR
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cml comment create report.md --watermark-title="Data Checker"
